site_name: CNEquity
site_description: 面向量化研究的中国市场本地数据湖，支持行情、财报、SQL 和 MCP 查询
site_url: https://rootsunc.github.io/CNEquity/
repo_name: rootSunc/CNEquity
repo_url: https://github.com/rootSunc/CNEquity
edit_uri: edit/main/docs/zh/
docs_dir: docs/zh
site_dir: site

theme:
  name: material
  custom_dir: docs/overrides
  language: zh
  font: false
  icon:
    logo: material/chart-box-outline
  features:
    - navigation.instant
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换浅色模式

plugins:
  - search:
      jieba_dict_user: docs/search-terms.txt

hooks:
  - docs/site.py

validation:
  nav:
    omitted_files: ignore
  links:
    not_found: warn
    anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}

nav:
  - 首页: index.md
  - 快速开始: getting-started/quickstart.md
  - 整体设计: architecture/overview.md
  - 数据与覆盖: datasets/catalog.md
  - 查询与研究: datasets/query-guide.md
  - 参考:
      - Python API: reference/python-api.md
      - MCP: reference/mcp.md
      - 配置: getting-started/configuration.md
      - 命令与副作用: reference/cli-surface.md
  - 运行与维护:
      - 日常更新: operations/runbook.md
      - 故障排查: operations/troubleshooting.md
  - 安装与升级: getting-started/installation.md
  - 许可、来源与引用: legal-and-data-sources.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rootSunc/CNEquity
      name: GitHub
  generator: false
  alternate:
    - name: 中文
      link: /CNEquity/
      lang: zh
    - name: English
      link: /CNEquity/en/
      lang: en

copyright: Copyright © CNEquity Contributors
