site_name: CNEquity
site_description: 可日更、可溯源的 A 股研究数据湖
site_url: https://rootsunc.github.io/CNEquity/
repo_name: rootSunc/CNEquity
repo_url: https://github.com/rootSunc/CNEquity
edit_uri: edit/main/docs/
# `/README.md` is the in-repo docs index, not a site page. The three
# `*（已迁移/已并入）` stubs are redirect tombstones for links that predate the
# docs reorg; they have no inbound links left inside the tree and only added
# dead-end search hits. `assets/README.md` is an internal inventory of the
# image sources. All still resolve on GitHub, which is where the old links
# point.
exclude_docs: |
  /README.md
  /architecture.md
  /ops-runbook.md
  /datasets/README.md
  /assets/README.md

theme:
  name: material
  custom_dir: docs/overrides
  language: zh
  font: false
  icon:
    logo: material/chart-box-outline
  features:
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换浅色模式

plugins:
  - search

extra_css:
  - stylesheets/extra.css

# The repository also keeps links to root-level contributor/legal files and
# source paths that are intentionally outside the published docs tree. MkDocs
# should preserve those links while still failing on broken entries in `nav`.
#
# `anchors` is deliberately NOT ignored: with the Unicode slugifier configured
# below, in-page anchors are checkable, and `mkdocs build --strict` is what
# keeps a renamed Chinese heading from silently orphaning every link to it.
# `not_found` stays ignored only because of the out-of-tree links above.
validation:
  nav:
    omitted_files: ignore
  links:
    absolute_links: ignore
    unrecognized_links: ignore
    not_found: ignore
    anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  # `docs/changelog.md` pulls in the repo-root CHANGELOG.md rather than
  # copying it: the release notes are the first thing a reader wants after
  # an upgrade, and a second copy would be the one that goes stale.
  # `check_paths` makes a missing or moved source fail the build instead of
  # publishing an empty page.
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
      # Python-Markdown's default slugifier strips every non-ASCII character,
      # so a pure-CJK heading collapses to a positional `_1` and a mixed one
      # loses its Chinese entirely (`## 调度组` -> `_1`). Every in-repo anchor
      # link was written against pymdownx's Unicode slugifier, which is what
      # this restores: `## 调度组` -> `#调度组`.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}

nav:
  - 首页: index.md
  - 快速开始:
      - 安装: getting-started/installation.md
      - 快速开始: getting-started/quickstart.md
      - 配置: getting-started/configuration.md
  - 研究 Recipes:
      - Recipe 索引: recipes/README.md
      - 复权基线: recipes/research-baseline.md
      - PIT 财报截面: recipes/pit-rebalance.md
      - DuckDB 与 Polars: recipes/duckdb-polars.md
  - 数据与查询:
      - 数据集目录: datasets/catalog.md
      - Schema: datasets/schema.md
      - 数据契约: datasets/contract.md
      - 数据源: datasets/sources.md
      - 查询指南: datasets/query-guide.md
      - Universe 画像: reference/universe-profiles.md
      - CLI 参考: reference/cli.md
      - Python API: reference/python-api.md
      - MCP: reference/mcp.md
  - 运维:
      - Runbook: operations/runbook.md
      - 排障: operations/troubleshooting.md
      - 数据源健康度: operations/source-health.md
      - 运维脚本: operations/scripts.md
  - 架构:
      - 总览: architecture/overview.md
      - 设计原则: architecture/design-principles.md
      - 数据流: architecture/data-flow.md
      - 数据湖布局: architecture/lake-layout.md
      - 模块索引: modules/README.md
      - ADR: adr/README.md
  - 更新日志: changelog.md
  - 贡献与合规:
      - 项目对比: comparison.md
      - 开发约定: development/conventions.md
      - 测试: development/testing.md
      - 新增数据集: development/adding-dataset.md
      - 版本与数据契约治理: development/release-governance.md
      - 引用项目: citation.md
      - 数据许可: legal-and-data-sources.md
      - 来源合规矩阵: legal/source-matrix.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rootSunc/CNEquity
      name: GitHub
  generator: false

