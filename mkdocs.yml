site_name: CNMarketLake
site_description: 可日更、可溯源的 A 股研究数据湖
site_url: https://rootsunc.github.io/cn-market-lake/
repo_name: rootSunc/cn-market-lake
repo_url: https://github.com/rootSunc/cn-market-lake
edit_uri: edit/main/docs/
exclude_docs: "/README.md"

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换浅色模式

plugins:
  - search

# The repository also keeps links to root-level contributor/legal files and
# source paths that are intentionally outside the published docs tree. MkDocs
# should preserve those links while still failing on broken entries in `nav`.
validation:
  nav:
    omitted_files: ignore
  links:
    absolute_links: ignore
    unrecognized_links: ignore
    not_found: ignore
    anchors: ignore

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 快速开始:
      - 安装: getting-started/installation.md
      - 快速开始: getting-started/quickstart.md
      - 配置: getting-started/configuration.md
  - 研究 Recipes:
      - Recipe 索引: recipes/README.md
      - 复权基线: recipes/research-baseline.md
      - PIT 财报截面: recipes/pit-rebalance.md
      - DuckDB 与 Polars: recipes/duckdb-polars.md
  - 数据与查询:
      - 数据集目录: datasets/catalog.md
      - Schema: datasets/schema.md
      - 查询指南: datasets/query-guide.md
      - Python API: reference/python-api.md
      - MCP: reference/mcp.md
  - 运维:
      - Runbook: operations/runbook.md
      - 排障: operations/troubleshooting.md
      - 数据源健康度: operations/source-health.md
  - 架构:
      - 总览: architecture/overview.md
      - 数据流: architecture/data-flow.md
      - 数据湖布局: architecture/lake-layout.md
      - ADR: adr/README.md
  - 贡献与合规:
      - 开发约定: development/conventions.md
      - 测试: development/testing.md
      - 新增数据集: development/adding-dataset.md
      - 引用项目: citation.md
      - 数据许可: legal-and-data-sources.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rootSunc/cn-market-lake
      name: GitHub
  generator: false

copyright: Copyright © CNMarketLake Contributors
