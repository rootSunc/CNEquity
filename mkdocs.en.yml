# Build after the Chinese site so the two output directories can coexist.
INHERIT: mkdocs.yml

site_description: Local China-market data lake for quantitative research with Python, SQL, and MCP
site_url: https://rootsunc.github.io/CNEquity/en/
edit_uri: edit/main/docs/en/
docs_dir: docs/en
site_dir: site/en

theme:
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Quickstart: getting-started/quickstart.md
  - Design: architecture/overview.md
  - Data and coverage: datasets/catalog.md
  - Query and research: datasets/query-guide.md
  - Reference:
      - Python API: reference/python-api.md
      - MCP: reference/mcp.md
      - Configuration: getting-started/configuration.md
      - Commands and side effects: reference/cli-surface.md
  - Operations:
      - Daily updates: operations/runbook.md
      - Troubleshooting: operations/troubleshooting.md
  - Install and upgrade: getting-started/installation.md
  - License, sources, and citation: legal-and-data-sources.md
