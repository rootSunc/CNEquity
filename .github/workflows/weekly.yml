# Checks that matter and do not belong on every pull request.
# A newly published advisory does not need a code change to become true.
# A shuffled unit run catches tests that pass only because an earlier test
# left state behind; running that beside the ordered suite would pay for the
# suite twice on every change.

name: Weekly

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Audit the wheel a user would install
        env:
          RUNTIME_ROOT: ${{ runner.temp }}/cnequity-audit-runtime
          SCANNER_ROOT: ${{ runner.temp }}/cnequity-audit-scanner
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m venv "$RUNTIME_ROOT"
          "$RUNTIME_ROOT/bin/python" -m pip install --upgrade pip
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          "$RUNTIME_ROOT/bin/pip" install "$wheel"
          python -m venv "$SCANNER_ROOT"
          "$SCANNER_ROOT/bin/python" -m pip install --upgrade pip pip-audit
          runtime_site=$(
            "$RUNTIME_ROOT/bin/python" -c \
              'import sysconfig; print(sysconfig.get_path("purelib"))'
          )
          "$SCANNER_ROOT/bin/pip-audit" --path "$runtime_site"

  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Unit tests in random order
        run: pytest tests/unit -q -p randomly
