# Publish a tag that is already on main.
#
# Main has already run the suite. This workflow checks what a green checkout
# does not: the tag matches the package version, the dataset contract is the
# one being shipped, a clean install of the built wheel can open the offline
# sample, and that install has no known vulnerable dependency. PyPI and the
# GitHub Release are created only for a stable vMAJOR.MINOR.PATCH tag.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . build twine

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "only stable vMAJOR.MINOR.PATCH tags may publish to PyPI" >&2
            exit 1
          }
          package_version=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )
          test "${TAG_VERSION#v}" = "$package_version" || {
            echo "tag ${TAG_VERSION} does not match pyproject version ${package_version}" >&2
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "release tag must point to a commit already on main" >&2
            exit 1
          }

      - name: Validate the dataset contract
        run: |
          set -euo pipefail
          package_version=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )
          contract="contracts/v${package_version}.json"
          test -f "$contract"
          cne contract validate "$contract" --against-registry
          python scripts/dev/check_release_contract.py --current "$contract" \
            --output "${RUNNER_TEMP}/contract-diff.json"

      - name: Fresh-lake snapshot recovery drill
        run: python scripts/dev/fresh_lake_e2e.py --skip-wheel-smoke

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: |
          set -euo pipefail
          twine check dist/*
          python scripts/dev/check_public_package.py dist/*
          package_version=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )
          sdist=$(find dist -maxdepth 1 -name "*.tar.gz" -print -quit)
          wheel=$(find dist -maxdepth 1 -name "*.whl" -print -quit)
          test -n "$sdist" && test -n "$wheel"
          tar -tzf "$sdist" | grep -Fx "cnequity-${package_version}/contracts/v${package_version}.json"
          unzip -Z1 "$wheel" | grep -F "/share/cnequity/contracts/v${package_version}.json"

      - name: Install the wheel into a clean environment
        env:
          RUNTIME_ROOT: ${{ runner.temp }}/cnequity-release-runtime
        run: |
          set -euo pipefail
          python -m venv "$RUNTIME_ROOT"
          "$RUNTIME_ROOT/bin/python" -m pip install --upgrade pip
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          "$RUNTIME_ROOT/bin/pip" install "$wheel"

      - name: Audit installed dependencies
        env:
          RUNTIME_ROOT: ${{ runner.temp }}/cnequity-release-runtime
          SCANNER_ROOT: ${{ runner.temp }}/cnequity-release-scanner
        run: |
          set -euo pipefail
          python -m venv "$SCANNER_ROOT"
          "$SCANNER_ROOT/bin/python" -m pip install --upgrade pip pip-audit
          runtime_site=$(
            "$RUNTIME_ROOT/bin/python" -c \
              'import sysconfig; print(sysconfig.get_path("purelib"))'
          )
          "$SCANNER_ROOT/bin/pip-audit" --path "$runtime_site"

      - name: Smoke-test the installed wheel
        env:
          RUNTIME_ROOT: ${{ runner.temp }}/cnequity-release-runtime
        run: |
          mkdir -p "$RUNTIME_ROOT/work"
          cd "$RUNTIME_ROOT/work"
          unset CNE_CONFIG PYTHONPATH
          "$RUNTIME_ROOT/bin/cne" --version
          "$RUNTIME_ROOT/bin/cne" doctor
          "$RUNTIME_ROOT/bin/cne" config create --data-root "$RUNTIME_ROOT/production-layout"
          "$RUNTIME_ROOT/bin/cne" config validate
          "$RUNTIME_ROOT/bin/cne" init --layout-only
          "$RUNTIME_ROOT/bin/cne" init --profile sample \
            --data-root data/cnequity-sample --config-out configs/cnequity.sample.toml
          "$RUNTIME_ROOT/bin/cne" config validate --config configs/cnequity.sample.toml
          "$RUNTIME_ROOT/bin/cne" query --config configs/cnequity.sample.toml \
            --sql "SELECT symbol, trade_date, close, source FROM daily_bars LIMIT 5"
          "$RUNTIME_ROOT/bin/cne" status --config configs/cnequity.sample.toml --datasets
          "$RUNTIME_ROOT/bin/cne" verify --config configs/cnequity.sample.toml
          "$RUNTIME_ROOT/bin/cne" audit --config configs/cnequity.sample.toml --full --quality-only
          "$RUNTIME_ROOT/bin/python" -I - <<'PY'
          import sys
          from pathlib import Path
          import cnequity
          from cnequity.query import load

          assert Path(cnequity.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          bars = load("daily_bars", data_root="data/cnequity-sample")
          assert bars.height == 150, bars.shape
          assert bars["symbol"].n_unique() == 5
          assert bars["trade_date"].n_unique() == 30
          assert bars["source"].unique().to_list() == ["mock"]
          print("Installed wheel: sample Parquet and Python query passed")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/cnequity
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/dev/release_notes.py "$TAG" > release-notes.md
          title=$(python3 scripts/dev/release_notes.py --title "$TAG")
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file release-notes.md
          else
            gh release create "$TAG" --verify-tag --title "$title" \
              --notes-file release-notes.md
          fi
