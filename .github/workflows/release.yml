name: Release

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - "pyproject.toml"
      - "README.pypi.md"
      - "CHANGELOG.md"
      - "src/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Install project and test tooling
        run: pip install -e . --group dev
      - name: Run offline regression suite
        run: pytest tests/unit -q
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          package_version=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )
          test "${TAG_VERSION#v}" = "$package_version" || {
            echo "tag ${TAG_VERSION} does not match pyproject version ${package_version}" >&2
            exit 1
          }
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: twine check dist/*
      - name: Smoke-test the built wheel
        env:
          SMOKE_ROOT: ${{ runner.temp }}/cn-market-lake-wheel-smoke
        run: |
          python -m venv "$SMOKE_ROOT"
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          "$SMOKE_ROOT/bin/python" -m pip install --upgrade pip
          "$SMOKE_ROOT/bin/pip" install "$wheel"
          "$SMOKE_ROOT/bin/cml" --version
          "$SMOKE_ROOT/bin/cml" demo --help
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/cn-market-lake
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
