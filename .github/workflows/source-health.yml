name: Source health

on:
  schedule:
    # Weekly, after the weekend, from GitHub's overseas runners. The report is
    # a vantage point, not a universal SLA; mainland users should run `cml
    # sources --vantage cn` in their own scheduler as well.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-health
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    # A blocked overseas probe is evidence, not a broken code build. The JSON
    # artifact and job summary remain available when a source is red.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Probe public sources
        env:
          HEALTH_ROOT: ${{ runner.temp }}/cn-market-lake-health
        run: |
          set -o pipefail
          mkdir -p "$HEALTH_ROOT"
          cml config init \
            --config "$HEALTH_ROOT/cn-market-lake.toml" \
            --data-root "$HEALTH_ROOT/data"
          cml sources \
            --config "$HEALTH_ROOT/cn-market-lake.toml" \
            --vantage github-actions \
            --only tdx_protocol,sina,eastmoney_push2,eastmoney_push2his,cninfo \
            --out "$HEALTH_ROOT/source-health.json" \
            | tee "$HEALTH_ROOT/source-health.txt"
      - name: Add report to job summary
        if: always()
        env:
          HEALTH_ROOT: ${{ runner.temp }}/cn-market-lake-health
        run: |
          if [ -f "$HEALTH_ROOT/source-health.txt" ]; then
            {
              echo "## Weekly source health"
              echo
              echo '```text'
              cat "$HEALTH_ROOT/source-health.txt"
              echo '```'
              echo
              echo "This is the GitHub Actions / overseas vantage. It is not an SLA."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Source probe did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cn-market-lake-health/source-health.json
            ${{ runner.temp }}/cn-market-lake-health/source-health.txt
          if-no-files-found: warn
          retention-days: 30
