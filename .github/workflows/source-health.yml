name: Source health

on:
  schedule:
    # Daily after the mainland close for critical paths, plus a weekly full
    # sweep. The report is
    # a vantage point, not a universal SLA; mainland users should run `cne
    # sources --vantage cn` in their own scheduler as well.
    - cron: "17 10 * * 1-5"
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-health
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    # A blocked overseas probe is evidence, not a broken code build. The JSON
    # artifact and job summary remain available when a source is red.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Restore source-health evidence
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/cnequity-health/data/meta/source_health
          key: source-health-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            source-health-${{ runner.os }}-
      - name: Probe public sources
        env:
          HEALTH_ROOT: ${{ runner.temp }}/cnequity-health
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -o pipefail
          mkdir -p "$HEALTH_ROOT"
          cne config create \
            --config "$HEALTH_ROOT/cnequity.toml" \
            --data-root "$HEALTH_ROOT/data"
          if [ "$SCHEDULE" = "17 3 * * 1" ]; then
            cne sources probe \
              --config "$HEALTH_ROOT/cnequity.toml" \
              --vantage github-actions \
              | tee "$HEALTH_ROOT/source-health.txt"
          else
            cne sources probe \
              --config "$HEALTH_ROOT/cnequity.toml" \
              --vantage github-actions \
              --only tdx_protocol,sina,eastmoney_push2,eastmoney_push2his,cninfo \
              | tee "$HEALTH_ROOT/source-health.txt"
          fi
          cne sources slo --config "$HEALTH_ROOT/cnequity.toml" \
            > "$HEALTH_ROOT/source-slo.json"
          cne sources resilience --out "$HEALTH_ROOT/source-resilience.json" --enforce \
            > "$HEALTH_ROOT/source-resilience.stdout.json"
      - name: Add report to job summary
        if: always()
        env:
          HEALTH_ROOT: ${{ runner.temp }}/cnequity-health
        run: |
          if [ -f "$HEALTH_ROOT/source-health.txt" ]; then
            {
              echo "## Weekly source health"
              echo
              echo '```text'
              cat "$HEALTH_ROOT/source-health.txt"
              echo '```'
              echo
              echo "This is the GitHub Actions / overseas vantage. It is not an SLA."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Source probe did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-health-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cnequity-health/data/meta/source_health/**
            ${{ runner.temp }}/cnequity-health/source-health.txt
            ${{ runner.temp }}/cnequity-health/source-slo.json
            ${{ runner.temp }}/cnequity-health/source-resilience.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve source-health evidence
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/cnequity-health/data/meta/source_health
          key: source-health-${{ runner.os }}-${{ github.run_id }}
