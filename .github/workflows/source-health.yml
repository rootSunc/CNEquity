name: Source health

# Probes the public A-share sources once a day and publishes the result.
#
# THE RUNNER IS AN OVERSEAS VANTAGE. GitHub's hosted runners are outside the
# mainland, and several of these sources refuse non-mainland egress at the WAF.
# Publishing that as "the" status would report an outage that mainland users do
# not have, so this job labels its report `overseas` and the page renders it
# beside any `cn` report committed under docs/source-health/ by an operator
# running the same command from a mainland network. Neither column is corrected
# against the other.

on:
  schedule:
    # 09:20 UTC = 17:20 Asia/Shanghai — after the close, before the daily
    # pipeline's evening groups, so a source that broke during the session shows
    # up here before it costs anyone a run.
    - cron: "20 9 * * 1-5"
  workflow_dispatch:

concurrency:
  group: source-health
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Write a config pointing at a scratch lake
        # The probes never read the lake — they call the sources. A config is
        # still required because it carries the rate limits and timeouts the
        # adapters pace themselves with, and probing without them would hit
        # these hosts harder than the pipeline ever does.
        run: |
          mkdir -p site/reports
          asl config init --config ci.toml --data-root "$PWD/.health-lake"

      - name: Probe
        # Never fails the job. A red source is this workflow's output, not its
        # error — exiting non-zero would stop the page from publishing on
        # exactly the days it matters.
        run: |
          asl sources probe \
            --config ci.toml \
            --vantage overseas \
            --out site/reports/overseas.json

      - name: Collect any operator-supplied vantages
        # A mainland report is committed by whoever runs the daily pipeline
        # there: `asl sources probe --vantage cn --out docs/source-health/cn.json`.
        # Absent, the page simply shows one column.
        run: |
          shopt -s nullglob
          for report in docs/source-health/*.json; do
            cp "$report" site/reports/
          done

      - name: Render
        run: |
          args=()
          for report in site/reports/*.json; do
            args+=(--report "$report")
          done
          asl sources page "${args[@]}" --out site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: probe
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
