# Pull requests, main, and release validation branches.
#
# The offline suite takes long enough that running it on every claimed
# interpreter is mostly wait. It runs on the floor (3.11) and the newest
# claimed interpreter (3.14), and once more on 3.11 with the oldest declared
# httpx. 3.12 and 3.13 only have to install: a missing native wheel fails
# there. Windows and macOS each
# run the unit suite once on 3.12. Several checks are skipped unless the
# runner is that operating system: Windows file locks and Task Scheduler XML,
# macOS plist lint, clonefile and the open-file-limit fallback.
#
# The wheel, the generated docs and the dataset contract are checked on every
# run because a green test suite does not catch those. Publishing, the docs
# site and the weekly advisory scan are separate workflows. Upstream data
# sources are not probed here: availability is outside this repository's
# security scope, and a GitHub-hosted runner is the wrong vantage.

name: CI

on:
  push:
    branches: [main, 'codex/release-*-validation']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The contract diff reads the previous release tag out of history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev build

      - name: Lint
        run: |
          ruff check .
          ruff format --check .
          shellcheck scripts/dev/*.sh

      - name: Generated docs in sync
        run: python scripts/dev/sync_docs.py --check

      - name: Dataset contract
        run: |
          set -euo pipefail
          package_version=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              print(tomllib.load(fh)["project"]["version"])
          PY
          )
          contract="contracts/v${package_version}.json"
          test -f "$contract"
          cne contract validate "$contract" --against-registry
          python scripts/dev/check_release_contract.py --current "$contract" \
            --output "${RUNNER_TEMP}/contract-diff.json"

      - name: Public package boundary
        run: |
          python -m build --sdist --wheel
          python scripts/dev/check_public_package.py dist/*.whl dist/*.tar.gz

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check dashboard bundle
        working-directory: frontend
        run: |
          npm ci
          npm run check

  test:
    name: tests (${{ matrix.python-version }}, httpx ${{ matrix.httpx }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
        httpx: ["latest"]
        include:
          # pyproject declares `httpx>=0.25`. httpx 0.28 changed `params` from
          # merging into a URL's query to replacing it (see
          # adapters/eastmoney/em_auth.py), so the floor is tested, not assumed.
          - python-version: "3.11"
            httpx: "0.25.2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        env:
          HTTPX: ${{ matrix.httpx }}
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev
          if [ "$HTTPX" != "latest" ]; then
            pip install "httpx==$HTTPX"
          fi
          python -c "import httpx; print('httpx', httpx.__version__)"

      - name: Test
        run: pytest -q -n auto

  install:
    name: install (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package a user would install
        run: |
          python -m pip install --upgrade pip
          pip install .
          cne --version
          python -c "import cnequity, duckdb, polars, pyarrow, curl_cffi"

  # Windows is the platform the suite cannot fake: lock files, paths and the
  # default console encoding. One interpreter is enough. The dashboard bundle
  # is checked on Linux; the check is a rebuild diff, not a Windows API.
  test-windows:
    name: tests (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Install DuckDB extensions
        # Once, before the parallel workers: on a fresh runner they each
        # download the same extension, and Windows refuses the second rename.
        run: python -c "import duckdb; from equitylake_core.extensions import ensure_extensions; print(ensure_extensions(duckdb.connect()))"

      - name: Test
        # tests/conftest.py handles Windows atexit noise only after a fully
        # successful session. Preserve pytest's exit code here so interruption
        # or an internal error cannot pass on a partial "N passed" summary.
        shell: bash
        run: pytest tests/unit -q -n auto

  # Same unit suite as Windows. The tests that call plutil, clonefile and the
  # Darwin open-file limit do not run on Linux.
  test-macos:
    name: tests (macos)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Test
        run: pytest tests/unit -q -n auto

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: a key in an old commit is the case SECURITY.md cares
      # about, and a shallow checkout cannot see it. The pre-commit hook only
      # covers clones that installed it. Allowlist: .gitleaks.toml.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for committed secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
