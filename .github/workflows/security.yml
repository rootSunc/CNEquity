name: Supply-chain security

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "contracts/**"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel
        run: python -m build --wheel

      - name: Install built wheel into a clean runtime environment
        env:
          RUNTIME_ROOT: ${{ runner.temp }}/cnequity-security-runtime
        run: |
          set -euo pipefail
          python -m venv "$RUNTIME_ROOT"
          "$RUNTIME_ROOT/bin/python" -m pip install --upgrade pip
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          "$RUNTIME_ROOT/bin/pip" install "$wheel"

      - name: Generate runtime CycloneDX SBOM and dependency audit
        env:
          RUNTIME_ROOT: ${{ runner.temp }}/cnequity-security-runtime
          SCANNER_ROOT: ${{ runner.temp }}/cnequity-security-scanner
        run: |
          set -euo pipefail
          python -m venv "$SCANNER_ROOT"
          "$SCANNER_ROOT/bin/python" -m pip install --upgrade pip pip-audit cyclonedx-bom
          "$SCANNER_ROOT/bin/cyclonedx-py" environment \
            "$RUNTIME_ROOT/bin/python" \
            --output-format JSON --output-file sbom.cdx.json
          runtime_site=$(
            "$RUNTIME_ROOT/bin/python" -c \
              'import sysconfig; print(sysconfig.get_path("purelib"))'
          )
          "$SCANNER_ROOT/bin/pip-audit" \
            --path "$runtime_site" --format=json --output=pip-audit.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-evidence
          path: |
            sbom.cdx.json
            pip-audit.json
          if-no-files-found: warn
