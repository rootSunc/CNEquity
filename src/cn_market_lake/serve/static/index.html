<!doctype html>
<!--
  Lake dashboard shell. Behaviour lives in bundle.js, built from frontend/ and
  committed so `pip install` needs no node.

  Self-contained on purpose: the only script is same-origin, there is no CDN and
  no external font. A lake often runs on an offline box or behind a proxy, and
  an external asset there is a page that does not load.
-->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CNMarketLake</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div id="app"></div>
<script src="/static/bundle.js"></script>
</body>
</html>
