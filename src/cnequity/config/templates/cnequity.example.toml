# Example / default cnequity config.
# Repo copy: configs/cnequity.example.toml
# Packaged copy: src/cnequity/config/templates/cnequity.example.toml
# Keep both identical — `cne config init` ships the packaged file.

[data]
root = "./data/cnequity"

[orchestrator]
# `workers` remains the legacy/global process budget.  The TDX and HTTP pools
# below are independent: `cne config init` reduces this value to 1 on macOS,
# while the macOS-safe TDX thread pool still uses `tdx_daily_workers`.
# Windows defaults to 1 via `cne config init`; Linux may use >1.
workers = 8
tdx_daily_workers = 4
tdx_daily_backend = "auto"  # macOS: thread; Linux: process; override if needed
adj_factor_workers = 4       # Sina HTTP fan-out; independent of TDX workers
derive_workers = 4
# Maximum in-flight requests per source.  Pacing (`min_interval_seconds`) is
# still the QPS guard; these caps protect upstream connection capacity when
# independent DAG steps or derives overlap.
source_concurrency = { eastmoney = 4, ths = 2, ths_pages = 1, ths_bonus = 1, cninfo = 2, pboc = 2, nbs = 2, exchange = 2, sina = 4, sina_bars = 2, bse = 2, baostock = 1, tushare = 2 }
batch_size = 100
max_retries = 3
retry_backoff_seconds = 5
batch_stale_seconds = 3600  # running batches without heartbeat for this long → stale (compact gate) / failed (retry)

[incremental]
# TTL for symbol/window-level source-empty evidence.  Set to 0 to retry every
# missing key; instrument catalog revisions still invalidate live evidence.
negative_evidence_ttl_days = 7

[tdx_protocol]
enabled = true
# Cross-process paced; 100ms is safer for long daily sweeps than 50ms.
min_interval_ms = 100
# Maximum time to wait for the shared cross-process rate-limit lock.
# A timeout fails the request so it can be retried; it never bypasses pacing.
lock_timeout_sec = 15.0
servers = "auto"
connect_timeout_sec = 10
# Test/demo only: return fabricated rows (labeled source="mock") instead of
# failing when the TDX source is unavailable. Never enable in production.
allow_mock = false

# Preferred standard-market host pool. When servers="auto", these are probed
# in parallel (first that returns real data wins) before the bundled
# list. Fill with hosts known-good for your network; leave empty to rely on
# the bundled list. Extended (HK/futures) hosts do not serve A-share bars.
[tdx_protocol.hosts]
standard = [
    "120.76.1.198:7709",
    "123.125.108.101:7709",
    "114.141.177.118:7709",
    "114.141.177.40:7709",
    "27.151.2.113:7709",
    "27.151.2.38:7709",
    "202.100.166.12:7709",
    "182.118.8.9:7709",
    "1.202.143.37:7709",
    "111.203.134.118:7709",
    "117.133.128.226:7709",
]

[sources.eastmoney]
enabled = true
# Paced for a mainland route, which is what EastMoney serves without complaint.
# The heaviest consumers are fund_flow's ~54-page clist sweep and the
# margin_trading backfill (one datacenter request per trading day), so this is
# what a multi-year backfill runs at. Raise it if EastMoney starts 429ing.
# (sector_bars is *not* paced here — it is a 同花顺 dataset; see [sources.ths].)
min_interval_seconds = 0.5
# Per-request timeout (seconds). Connect/timeout/protocol errors do not retry.
timeout_sec = 30
# No batch_size / batch_rest_seconds here: EastMoney sweeps pace on
# min_interval_seconds alone. The batch cool-down is a baostock mechanism —
# see [sources.baostock], where it guards against the IP blacklist.
# Optional HTTP(S) proxy for every EastMoney host. Only needed without a
# mainland route: overseas and some cloud egress get 502s or dropped TLS from
# push2/push2his. Point it at any proxy that has one (Clash, ssh -D, a China
# VPS). When unset, httpx still honors HTTPS_PROXY / HTTP_PROXY env vars.
# proxy = "http://127.0.0.1:7890"

[sources.ths]
# 同花顺 — primary source for sector_bars (board index OHLC), history and daily.
# push2his (EastMoney's kline host) refuses non-mainland egress at the WAF layer,
# and mixing sources put two index bases in one series; see docs.
enabled = true
# d.10jqka.com.cn (kline). Measured safe: ~1300 sequential requests at this pace
# with zero failures, which is a full 432-board sweep in ~8 min. Do not lower it —
# a rate-limit ban costs far more than the minutes it saves.
min_interval_seconds = 1.0

[sources.ths_pages]
# q.10jqka.com.cn (board catalog and listing pages) is far less tolerant than
# the kline host: it began returning 401 after ~23 requests at 1 req/s. Only the
# catalog build touches it (~95 requests, then cached to
# meta/state/ths_board_catalog.json), so this interval costs a rare rebuild
# rather than anything on the daily path.
#
# 20.0 used to sit here as an admitted guess — the only figure ever measured was
# the rate that failed. Measured 2026-08, 25 sequential requests per rung:
# 8s, 5s, 3s, 2s and 1.5s each came back 25/25 clean. 3.0 is therefore twice the
# fastest rate observed to be safe and three times the one known to fail, and it
# takes a catalog rebuild from ~32 min to ~5 min.
#
# Caveat worth keeping: that test was 25 requests of one URL, while a real
# rebuild is ~95 across several. Lower it further only with a longer run behind
# the number.
enabled = true
min_interval_seconds = 3.0

[sources.ths_bonus]
# 同花顺个股历史分红页（显式 BJ corporate_actions repair）。与目录页分开限速。
enabled = true
min_interval_seconds = 3.0

[sources.cninfo]
enabled = true
min_interval_seconds = 1.0

# 中国人民银行 调查统计司 — publishes 社会融资规模增量 (macro_indicators).
# One index fetch plus one workbook per year, so pace it politely.
[sources.pboc]
enabled = true
min_interval_seconds = 1.0

# 国家统计局 — the 制造业 PMI release, used to cross-check the vendor's value.
# Set enabled = false to keep `cne audit` off the network.
[sources.nbs]
enabled = true
min_interval_seconds = 1.0

# 上交所 / 深交所 listing tables — official ST designations, cross-checked
# against `trading_status`. One request per exchange.
[sources.exchange]
enabled = true
min_interval_seconds = 1.0

[sources.sina]
enabled = true
min_interval_seconds = 0.3

# Sina daily-bar fallback has its own slower limiter. The factor endpoint and
# the per-symbol kline endpoint have different upstream rate-limit behavior.
[sources.sina_bars]
enabled = true
min_interval_seconds = 1.0

# BSE official current quote snapshot; primary source for current BJ tip bars
# and turnover. It is not a history source; historical BJ windows still use Sina.
[sources.bse]
enabled = true
min_interval_seconds = 1.0

# Free TCP API. Official limits: ≤50k API requests/day, no concurrent connections;
# exceeding either puts the IP on the blacklist (error_code=10001011).
# Full-market history must be slow or the IP gets blacklisted.
# ~5000 symbols × (1s + batch rests) ≈ many hours to days — intentional.
[sources.baostock]
enabled = true
min_interval_seconds = 1.0
batch_size = 20
batch_rest_seconds = 120

# Optional Tushare Pro — historical BJ ST evidence (stock_st).
# stock_st starts at 2017-01-01; 2016 uses bak_basic name evidence. Both need a
# token; older BJ bars remain unresolved instead of certifying them as normal.
# Prefer the environment variable TUSHARE_TOKEN so the credential never enters config.
[sources.tushare]
enabled = false
min_interval_seconds = 1.0
# token = "..."

[margin_trading]
# "exchange" reads 融资融券 detail from the SSE and SZSE, which compile it from
# member-firm reports — no redistributor in between. Verified against the
# EastMoney path for 2026-08-26: every compared field matched exactly, with
# 4,100 securities against EastMoney's 3,857.
#
# Two consequences to accept before switching, or set "eastmoney" instead:
#   * SSE does not publish 融券余额, so `short_balance` is null on SH rows.
#   * SZSE lands a business day after SSE, and a day is only written once both
#     have published, so the dataset trails the vendor path by ~one session.
source = "exchange"

[adj_factors]
source = "sina"
adjust_types = ["hfq"]
# The factor series has one vendor, so each step is re-derived from curated
# `corporate_actions` (a different vendor) and the disagreement is reported.
# Findings are advisory — they mark the run degraded, they never fail it.
# Tolerance is materiality, not equality: the two sides round differently.
crosscheck_enabled = true
crosscheck_tolerance_bps = 50
# At or above this gap the finding is raised from warning to error.
crosscheck_error_bps = 200

[sentiment]
# Batch path uses keyword lexicon only; SnowNLP is for on-demand stock_news.
use_snownlp = false
# HTTP stock_news fallback cap (primary news channel is curated news_headlines).
news_symbol_limit = 50

[minute_bars]
# Intraday bars. Off by default and NOT on the daily waves: full-market 1m is
# ~1.3M rows and ~30MB a day (6-8GB a year, several times the whole daily lake),
# which would change what `cne init` costs someone who never asked for it.
#
# HISTORY HORIZON. TDX keeps ~95 trading days of 1m and ~491 (about 2 years) of
# 5m and coarser. That is the vendor's retention, not this lake's backlog: an
# older window returns nothing, and no backfill source extends it. `cne backfill
# minute_bars --start` refuses a window that starts before the horizon.
enabled = false
# "index:<symbol>" — that index's latest constituents (~300 names for 沪深300,
#   about 2MB a day at 1m). "watchlist" — exactly the symbols listed below.
#   "all" — the whole universe; opt in knowingly.
scope = "index:000300.SH"
symbols = []
# Which frequencies to capture. Each lands in its own dataset:
#   "1m" -> minute_bars      (source keeps ~95 trading days)
#   "5m" -> minute_bars_5m   (source keeps ~491, about 2 years)
# Separate datasets because a dataset carries one watermark and one
# coverage_start, and those two horizons differ by 5x. 5m is the only intraday
# frequency with real history, and 15m/30m/60m aggregate from it exactly, so
# they are not stored.
frequencies = ["1m"]
# Concurrent TDX connections for the intraday fetch. This does NOT raise the
# request rate — the limiter is cross-process and paces every request either
# way — it only stops one lane idling on network latency between calls.
# Measured on 40 symbols x 5 sessions: 4.50 req/s at 1, 10.13 at 4, which is
# the ceiling the 100ms limiter already allows. 4 is the practical default
# now that backfill walks tip→horizon once per symbol (no date-slice re-walk).
fetch_workers = 4

[trade_ticks]
# Transaction records (分笔). Its own block, not a switch inside [minute_bars]:
# these are different decisions by an order of magnitude, and enabling minute
# bars must not quietly enable this.
#
# WHAT THIS IS. Not tick-by-tick trades. A-share Level-1 is a 3-second
# snapshot, so one row aggregates however many real trades landed in that frame
# (6-33 on average, measured). The timestamp has minute precision — the
# protocol never carried seconds — so rows are identified by `tick_seq`, their
# position in the session. `direction` is TDX's own tick-rule guess at who
# crossed the spread, not an exchange field.
#
# HISTORY. TDX serves back to 2024-01-02 for every symbol — a fixed floor, not
# a rolling window, and unrelated to the per-symbol bar-count limit the minute
# bars have. `cne backfill trade_ticks --start` refuses anything earlier.
#
# COST. ~1.85 requests and ~2,700 rows per symbol-session; ~4.25 bytes a row on
# disk. A 200-name watchlist is about a minute and ~3.8MB a day. Seeding those
# 200 names over the full history is ~312,000 requests and 10-11 hours.
enabled = false
# "watchlist" — exactly the symbols listed below. "index:<symbol>" — that
# index's latest constituents. There is no "all": see max_symbols.
scope = "watchlist"
symbols = []
# Hard ceiling on the resolved scope, checked before any fetch. 沪深300 resolves
# to ~300 names and so fails here until you raise this on purpose — the
# friction is deliberate, because the disk and the wire time are yours.
max_symbols = 200
# Concurrent TDX connections. As with [minute_bars], this does not raise the
# request rate (the limiter paces every request); it stops a lane idling on
# latency. Measured serial: 1.70 req/s.
fetch_workers = 4

[failover]
enabled = true
# Optional audit artifact during historical backfills. Keep false so a slow
# backup source cannot block the canonical TDX/Baostock historical fetch.
backfill_snapshots = false

[[failover.datasets]]
name = "daily_bars"
primary = "tdx_protocol"
backup = "eastmoney"
compare_fields = ["close", "volume"]
price_tolerance_bps = 10
# Capture the independent peer every clean primary day so the revision gate
# has same-day evidence, including days with zero corporate actions/bars gaps.
snapshot_cadence = "daily"
revision_gate = true
# 0 compares the complete same-day universe; use a positive value for a
# deterministic exchange-stratified sample when the backup is expensive.
sample_limit = 500
max_drift_fraction = 0.0

[[failover.datasets]]
name = "corporate_actions"
primary = "eastmoney"
backup = "tdx_protocol"
compare_fields = ["cash_dividend", "bonus_ratio", "transfer_ratio"]
price_tolerance_bps = 10
snapshot_cadence = "daily"
revision_gate = true

[exchange_audit]
# `daily_bars` against the closes the SSE and SZSE publish themselves — the one
# price check in the lake that reaches the publisher rather than a second
# vendor. Gated on `[sources.exchange]`; findings are advisory and never fail
# a run. SSE serves only the session it is currently publishing, so SH is
# arbitrated same-day; SZSE serves any past date.
price_tolerance_bps = 10
# Turnover is looser on purpose: the exchange daily total folds in trading a
# continuous-auction bar excludes, so curated is legitimately a little lower.
# Measured 2026-08-28, 305 of 5,212 shared symbols (5.9%) diverged, all SZ,
# all in the same direction. The finding fires on the *share* of the universe,
# so a widening gap is caught while the standing definitional one stays quiet.
turnover_tolerance_bps = 100
turnover_max_fraction = 0.15

[raw_archive]
# Exact source payloads are compressed under meta/raw. Request credentials,
# proxy settings, cookies, and authorization headers are never archived.
enabled = true
compression = "gzip"
max_payload_bytes = 33554432
# Omit datasets to use the built-in critical/snapshot-only set.
# datasets = ["announcement_index", "regulatory_events", "financial_statement_items", "corporate_actions"]

[universe]
default = "all_a"

# Wave DAG for daily job (see docs/datasets/catalog.md)
[[job.daily.waves]]
name = "reference"
parallel = true
steps = ["instruments", "trading_calendar", "trading_status"]

[[job.daily.waves]]
name = "corp_actions_to_bars"
parallel = false
steps = ["corporate_actions", "daily_bars"]

[[job.daily.waves]]
name = "parallel_core"
parallel = true
steps = ["index_bars"]

[[job.daily.waves]]
name = "finalize"
parallel = false
steps = ["compact", "derive_adj_factors", "derive_industry_index", "audit"]

# Group start times. Every `daily*` job takes the same non-blocking
# `daily_ingestion` lock, so a group that is still running when the next one
# fires does not queue — the next one aborts and that group is simply missing
# for the day. Spacing therefore has to cover the *slowest* plausible run, not
# the typical one.
#
# Measured end-to-end (2026-08, macOS so workers=1, overseas egress — i.e. the
# slow end): capital 10.3min, research 11.4min, fundamentals 2.6min,
# macro_risk 2.4min, signals 5s. `core` is the long pole: full-market
# daily_bars measured 543ms/symbol, ~49min for ~5400 symbols, which overran the
# old 30-minute gap to capital and silently cost that group every day.
#
# A mainland Linux box with workers=8 finishes core in minutes and will find
# this schedule far roomier than it needs. That is the intended asymmetry —
# starting late costs nothing, being skipped costs a day of data.
[job.daily.groups.core]
at = "16:00"
parallel = true
steps = [
  "instruments", "trading_calendar", "trading_status",
  "corporate_actions", "daily_bars", "index_bars",
  "compact", "derive_adj_factors", "derive_industry_index",
]

[job.daily.groups.capital]
at = "17:00"
parallel = true
steps = [
  "fund_flow", "northbound_holdings", "northbound_flows", "margin_trading",
  "valuation_metrics", "sector_members",
  "compact",
]

[job.daily.groups.signals]
at = "17:20"
parallel = true
steps = ["dragon_tiger", "block_trades", "compact"]

[job.daily.groups.fundamentals]
at = "17:35"
parallel = true
# share_structure / shareholder_counts are quarterly data, but filings trickle in
# over the weeks after each period end, so a daily re-sweep of the two most
# recent periods is how newly-disclosed ones get picked up. Each is ~11 pages.
#
# top_holders is deliberately NOT here: two reports × ~110 pages × two periods is
# ~440 pages, 40× these two, and on a slow link it would overrun the gap to
# macro_risk and cost that group its whole day (see the spacing note above). Run
# it on its own cadence: `cne backfill top_holders --start ... --end ...`.
steps = [
  "financial_statement_items", "earnings_disclosure_schedule",
  "index_constituents", "industry_members",
  "share_structure", "shareholder_counts", "compact",
]

[job.daily.groups.macro_risk]
at = "17:55"
parallel = true
steps = ["macro_indicators", "market_breadth", "share_unlock_schedule", "commodity_bars", "compact"]

[job.daily.groups.research]
at = "18:15"
parallel = true
# Sentiment scores lake news without HTTP.
steps = [
  "institutional_holdings", "analyst_consensus",
  "hot_rank", "sector_bars", "sector_fund_flow",
  "sentiment_scores", "compact",
]

# Not scheduled by anything: `cne run daily --group intraday` only. Enable
# [minute_bars] first, and read the horizon note there before expecting history.
[job.daily.groups.intraday]
at = "18:45"
parallel = true
steps = ["minute_bars", "minute_bars_5m", "compact"]

# Also unscheduled: `cne run daily --group ticks`. Its own group rather than a
# fourth entry in `intraday` above, so that turning on minute bars cannot drag
# transaction records along with it. Enable [trade_ticks] first.
[job.daily.groups.ticks]
at = "19:00"
parallel = true
steps = ["trade_ticks", "compact"]

# Independent 7x24 event feeds: run on their own cadence (e.g. corporate_events
# or periodic news_wire every 6h), bypassing trading calendar gates.
[job.events.groups.corporate_events]
at = "events"
parallel = true
steps = ["announcement_index", "regulatory_events", "compact"]

[job.events.groups.news_wire]
at = "events"
parallel = true
steps = ["flash_news_wire", "news_headlines", "compact"]

[job.init.phases]
names = [
  "phase1_reference",
  "phase2a_corporate_actions",
  "phase2c_daily_bars_backfill",
  "phase3_index_and_status",
  "phase4_finalize",
]

[on_demand]
enabled = true
datasets = ["stock_news", "research_reports"]

[duckdb]
path = "{data.root}/duckdb/cnequity.duckdb"
memory_limit = "2GB"
threads = 4
