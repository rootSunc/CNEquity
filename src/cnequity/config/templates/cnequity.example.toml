# Example / default cnequity config.
# Repo copy: configs/cnequity.example.toml
# Packaged copy: src/cnequity/config/templates/cnequity.example.toml
# Keep both identical — `cne config create` ships the packaged file.

[data]
root = "./data/cnequity"

[orchestrator]
# `workers` remains the legacy/global process budget.  The TDX and HTTP pools
# below are independent: `cne config create` reduces this value to 1 on macOS,
# while the macOS-safe TDX thread pool still uses `tdx_daily_workers`.
# Windows defaults to 1 via `cne config create`; Linux may use >1.
workers = 8
tdx_daily_workers = 4
tdx_daily_backend = "auto"  # macOS: thread; Linux: process; override if needed
adj_factor_workers = 4       # Sina HTTP fan-out; independent of TDX workers
derive_workers = 4
# Maximum in-flight requests per source.  Pacing (`min_interval_seconds`) is
# still the QPS guard; these caps protect upstream connection capacity when
# independent DAG steps or derives overlap.
source_concurrency = { tdx_protocol = 4, eastmoney = 4, ths = 2, ths_pages = 1, ths_bonus = 1, cninfo = 2, pboc = 2, nbs = 2, exchange = 2, sina = 4, sina_bars = 2, bse = 2, baostock = 1, tushare = 2, ths_official = 2 }
batch_size = 100
max_retries = 3
retry_backoff_seconds = 5
batch_stale_seconds = 3600  # running batches without heartbeat for this long → stale (compact gate) / failed (retry)

[incremental]
# TTL for symbol/window-level source-empty evidence.  Set to 0 to retry every
# missing key; instrument catalog revisions still invalidate live evidence.
negative_evidence_ttl_days = 7
# ISO weekday (1=Mon .. 7=Sun) on which datasets that declare a *shallow*
# reconciliation window walk their full one instead; 0 disables tiering and
# pays the full window on every run.
#
# Only `announcement_index` declares one today. CNINFO fixes its page at 30
# rows and ignores `pageSize`, so a short window still rereads pages the lake
# already has. A late-indexed announcement can appear after that window, so
# the full window is swept weekly rather than dropped. Its own `announce_date`
# is unchanged either way, so PIT correctness does not depend on when it
# arrives — only the lake's completeness lags.
deep_reconciliation_dow = 6

[quality]
# What a run does when the lake audit reports `error` findings.
#   off    — record nothing, never fail (pre-0.8.2 behaviour)
#   shadow — record what would have been blocked, but let the run succeed
#   block  — fail the run, so `cne status` and the pipeline exit code see it
# The audit step depends on `compact`, so it runs *after* the rows are in
# curated: blocking fails the run, it does not prevent the write. Shadow mode
# appends one line per affected run to `meta/quality/audit_gate.jsonl`, which
# is what to read before switching this to "block" — a gate turned on without
# knowing how often it fires is a gate that gets turned off again.
# Only `error` gates; the 32 checks that emit `warning` never do.
audit_gate = "shadow"
# Full offline audit of the candidate batch before publishing any pointer.
# block rejects new errors relative to the committed baseline; shadow reports only.
# This full-lake scan is opt-in; schema and batch gates always remain active.
publication_gate = "off"

[tdx_protocol]
enabled = true
# Cross-process paced; 100ms is safer for long daily sweeps than 50ms.
min_interval_ms = 100
# Maximum time to wait for the shared cross-process rate-limit lock.
# A timeout fails the request so it can be retried; it never bypasses pacing.
lock_timeout_sec = 15.0
servers = "auto"
connect_timeout_sec = 10
# Test/demo only: return fabricated rows (labeled source="mock") instead of
# failing when the TDX source is unavailable. Never enable in production.
allow_mock = false

# Preferred standard-market host pool. When servers="auto", these are probed
# in parallel (first that returns real data wins) before the bundled
# list. Fill with hosts known-good for your network; leave empty to rely on
# the bundled list. Extended (HK/futures) hosts do not serve A-share bars.
[tdx_protocol.hosts]
standard = [
    "120.76.1.198:7709",
    "123.125.108.101:7709",
    "114.141.177.118:7709",
    "114.141.177.40:7709",
    "27.151.2.113:7709",
    "27.151.2.38:7709",
    "202.100.166.12:7709",
    "182.118.8.9:7709",
    "1.202.143.37:7709",
    "111.203.134.118:7709",
    "117.133.128.226:7709",
]

[qmt_bridge]
# Preferred local terminal source for daily, index and 1m/5m bars.  Missing
# symbols still fall back to the TDX lane below.  Point bridge_src_path at the
# repository's src/
# directory if xtquant_big_convert is not installed.
enabled = false
# bridge_src_path = "../xtquant_big_convert/src"
# client_config_path = "../xtquant_big_convert/bigqmt_signal_trader_client_config.py"
# account_id = "YOUR_ACCOUNT_ID"
timeout_seconds = 30.0
download_timeout_seconds = 180.0
data_wait_seconds = 10.0
# 0 keeps the bridge's default batching.  50-100 is a safer choice for wide
# full-market sweeps.
chunk_size = 100
# "auto" infers 股/手 from amount / close / volume; "share" and "lot" pin it.
volume_unit = "auto"

[sources.eastmoney]
enabled = true
# General EastMoney HTTP lane; push2 and datacenter have stricter lanes below.
# These are client defaults, not a provider quota or a promise against bans.
# sector_bars uses THS and is paced separately.
min_interval_seconds = 0.5
# Per-request timeout (seconds). Connect/timeout/protocol errors do not retry.
timeout_sec = 30
# No batch_size / batch_rest_seconds here: EastMoney sweeps pace on
# min_interval_seconds alone. The batch cool-down is a baostock mechanism —
# see [sources.baostock], where it guards against the IP blacklist.
# Optional HTTP(S) proxy for every EastMoney host. When unset, HTTP_PROXY /
# HTTPS_PROXY are honored. Do not rotate egress to continue a refused sweep.
# proxy = "http://127.0.0.1:7890"
# Refuse every push2/push2his/push2delay request locally, before it is sent,
# so a banned IP can rest. The affected datasets fail fast as under the ban;
# datacenter and the other EastMoney hosts are untouched.
push2_paused = false
# push2 IP protection (see docs/zh/operations/troubleshooting.md). After the first
# refusal (403/429/5xx, a dropped connection, a timeout) refuse every push2
# host until local midnight — no backup-host failover.
push2_breaker = true
# Hard cap on push2 requests per local day, all processes together; 0 = none.
# Size it from this egress's own ledger, not from another lake's counts.
push2_daily_budget = 150
# One union-field full-market sweep shared by instruments / valuation /
# fund_flow / the clist bar fallback, reused while the market is closed.
push2_shared_snapshot = true
# push2's own pacing lane, separate from datacenter: one request every
# push2_min_interval_seconds, push2_max_concurrency in flight.
push2_min_interval_seconds = 4.0
push2_max_concurrency = 1
# datacenter-web: it serves most EastMoney datasets, including valuation.
# Breaker after datacenter_breaker_strikes refusals in a row
# (403/429/5xx, refused/reset/dropped connection; a slow-report timeout is not
# a refusal), or at once when "busy" survives every backoff.
datacenter_breaker = true
datacenter_breaker_strikes = 3
# 0 = count requests per day (meta/rate_limits/eastmoney_guard.json) without a cap;
# set a cap from the measured count.
datacenter_daily_budget = 0
# Optional daily cap shared by push2 and datacenter on this egress; 0 = observe only.
daily_budget = 0
# datacenter's own lane, separate from the other EastMoney hosts.
datacenter_min_interval_seconds = 1.0
datacenter_max_concurrency = 2
# Optional failover for proxy instability: only push2his historical K-lines
# retry once with trust_env=false, and never after the push2 breaker trips. Keep false where policy requires all traffic
# to use the proxy.
direct_fallback = false

[sources.ths]
# 同花顺 — primary source for sector_bars (board index OHLC), history and daily.
# Keep history and daily bars on one provider's index base; do not splice
# another provider's board index prices into this series.
enabled = true
# d.10jqka.com.cn (kline). This is a conservative client setting, not an
# upstream quota or a guarantee against refusals. Keep the board cache enabled.
min_interval_seconds = 1.0

[sources.ths_pages]
# q.10jqka.com.cn (board catalog/listing pages) has returned 401 under
# sustained access. The catalog is cached; avoid rebuilding it during routine
# source diagnostics. This interval is a client default, not a safe-rate claim.
enabled = true
min_interval_seconds = 3.0

[sources.ths_bonus]
# 同花顺个股历史分红页（显式 BJ corporate_actions repair）。与目录页分开限速。
enabled = true
min_interval_seconds = 3.0

[sources.cninfo]
enabled = true
min_interval_seconds = 1.0

# 中国人民银行 调查统计司 — publishes 社会融资规模增量 (macro_indicators).
# One index fetch plus one workbook per year, so pace it politely.
[sources.pboc]
enabled = true
min_interval_seconds = 1.0

# 国家统计局 — the 制造业 PMI release, used to cross-check the vendor's value.
# Disable this source to skip NBS comparisons; exchange checks have their own gate.
[sources.nbs]
enabled = true
min_interval_seconds = 1.0

# 上交所 / 深交所 listing tables — official ST designations, cross-checked
# against `trading_status`. One request per exchange.
[sources.exchange]
enabled = true
min_interval_seconds = 1.0

# The futures exchanges' own daily files (futures_bars, option_bars and the two
# contract tables). One label for all of them; each exchange is its own probe
# in `cne sources probe`. Daily files are requested per exchange/session/kind.
# Same-egress CLI processes can share CNE_RATE_LIMIT_ROOT; refusal circuits
# and pacing coordinate only processes configured to use that shared directory.
[sources.futures_exchange]
enabled = true
min_interval_seconds = 1.0

# Historical constituent files also need explicit pacing.
[sources.sw]
enabled = true
min_interval_seconds = 1.0
max_concurrency = 1

[sources.cni]
enabled = true
min_interval_seconds = 1.0
max_concurrency = 1

[sources.slo]
# Explicit operational exclusions from the SLO gate, not a region heuristic.
# Keep a documented reason; do not hide temporary bans by changing this list.
unreachable = []

[sources.sina]
enabled = true
min_interval_seconds = 0.3

# Sina daily-bar fallback has its own slower limiter. The factor endpoint and
# the per-symbol kline endpoint have different upstream rate-limit behavior.
[sources.sina_bars]
enabled = true
min_interval_seconds = 1.0
# How many trailing sessions the per-symbol Sina leg reconciles on a daily run.
# TDX has no Beijing route, so BJ history uses this one-request-per-symbol
# endpoint. A multi-session lookback on every BJ name multiplies those
# requests and can trip the vendor cooldown for unrelated symbols. The current
# Beijing tip comes from the BSE board snapshot below, so this only sets how
# far the per-symbol backstop reaches behind it.
# Raise it only if you have evidence that Sina revises settled BJ bars.
reconciliation_lookback_days = 1

# BSE official current quote snapshot; primary source for current BJ tip bars
# and turnover. It is not a history source; historical BJ windows still use Sina.
[sources.bse]
enabled = true
min_interval_seconds = 1.0

# Free TCP API. The client enforces the published limits in code: 50,000 API
# calls per Asia/Shanghai day, one connection at a time, and a blacklist freeze
# of (strikes this calendar year) × 6 hours after error_code=10001011. An empty
# release time waits at least 5 minutes and does not log in again during the
# freeze. batch_size / batch_rest_seconds only slow a long sweep; they cannot
# raise those limits. Keep one egress ledger across lakes.
[sources.baostock]
enabled = true
min_interval_seconds = 1.0
batch_size = 20
batch_rest_seconds = 120

# Optional Tushare Pro — historical BJ ST evidence (stock_st).
# stock_st starts at 2017-01-01; 2016 uses bak_basic name evidence. Both need a
# token; older BJ bars remain unresolved instead of certifying them as normal.
# Prefer the environment variable TUSHARE_TOKEN so the credential never enters config.
[sources.tushare]
enabled = false
min_interval_seconds = 1.0
# token = "..."

# Optional 同花顺 official API (fuyao.aicubes.cn) — a licensed peer source, never
# a primary. With no key every path that uses it degrades to silence and the lake
# keeps its existing sources, so leaving this section out costs only the extra
# cross-checks. Prefer HITHINK_FINANCE_API_KEY so the credential never enters config.
#
# `verify` and `backfill` are deliberately separate. Verification writes source
# snapshots and findings and never touches curated rows, so it is safe whenever a
# key is present. Backfill changes what the lake holds — the 2016-2024 balance
# sheet and cash-flow gap — so it stays off until asked for.
[sources.ths_official]
enabled = false
min_interval_seconds = 0.4
verify = true
backfill = false
# api_key = "..."

[margin_trading]
# "exchange" reads 融资融券 detail from the SSE and SZSE, which compile it from
# member-firm reports — no redistributor in between.
#
# Two consequences to accept before switching, or set "eastmoney" instead:
#   * SSE does not publish 融券余额, so `short_balance` is null on SH rows.
#   * SZSE lands a business day after SSE, and a day is only written once both
#     have published, so the dataset trails the vendor path by ~one session.
# A one-off historical repair may use `cne backfill margin_trading --margin-source
# eastmoney|exchange --start YYYY-MM-DD --end YYYY-MM-DD`; this leaves this
# default and each source's configured limiter unchanged.
source = "exchange"

[adj_factors]
source = "sina"
adjust_types = ["hfq"]
# The factor series has one vendor, so each step is re-derived from curated
# `corporate_actions` (a different vendor) and the disagreement is reported.
# Findings are advisory — they mark the run degraded, they never fail it.
# Tolerance is materiality, not equality: the two sides round differently.
crosscheck_enabled = true
crosscheck_tolerance_bps = 50
# At or above this gap the finding is raised from warning to error.
crosscheck_error_bps = 200

[sentiment]
# Batch path uses keyword lexicon only; SnowNLP is for on-demand stock_news.
use_snownlp = false
# HTTP stock_news fallback cap (primary news channel is curated news_headlines).
news_symbol_limit = 50

[minute_bars]
# Intraday bars. Off by default and NOT on the daily waves: full-market 1m
# has materially higher request and storage costs, which should not be added
# to `cne init` for someone who never asked for it.
#
# HISTORY HORIZON. TDX keeps ~95 trading days of 1m and ~491 (about 2 years) of
# 5m and coarser. That is the vendor's retention, not this lake's backlog: an
# older window returns nothing, and no backfill source extends it. `cne backfill
# minute_bars --start` refuses a window that starts before the horizon.
enabled = false
# "index:<symbol>" — that index's latest constituents (about 300 names for
#   沪深300). "watchlist" — exactly the symbols listed below.
#   "all" — the whole universe; opt in knowingly.
scope = "index:000300.SH"
symbols = []
# Which frequencies to capture. Each lands in its own dataset:
#   "1m" -> minute_bars      (source keeps ~95 trading days)
#   "5m" -> minute_bars_5m   (source keeps ~491, about 2 years)
# Separate datasets because a dataset carries one watermark and one
# coverage_start, and those two horizons differ by 5x. 5m is the only intraday
# frequency with real history. 15m/30m/60m are not frequencies here: they are
# resampled from 1m/5m, at query time or stored with `cne derive minute_bars_15m`.
frequencies = ["1m"]
# Concurrent TDX connections for the intraday fetch. This does NOT raise the
# request rate — the limiter is cross-process and paces every request either
# way — it only stops one lane idling on network latency between calls.
# Four workers can hide network latency without exceeding the configured
# request-start pace. Actual throughput depends on the TDX host and scope.
fetch_workers = 4

[trade_ticks]
# Transaction records (分笔). Its own block, not a switch inside [minute_bars]:
# these are different decisions by an order of magnitude, and enabling minute
# bars must not quietly enable this.
#
# WHAT THIS IS. Not tick-by-tick trades. A-share Level-1 is a 3-second
# snapshot, so one row can aggregate multiple real trades. The timestamp has
# minute precision — the protocol never carried seconds — so rows are identified by `tick_seq`, their
# position in the session. `direction` is TDX's own tick-rule guess at who
# crossed the spread, not an exchange field.
#
# HISTORY. TDX serves back to 2024-01-02 for every symbol — a fixed floor, not
# a rolling window, and unrelated to the per-symbol bar-count limit the minute
# bars have. `cne backfill trade_ticks --start` refuses anything earlier.
#
# COST. Per-symbol, per-session pagination makes broad history expensive;
# request counts, bytes and runtime depend on trading activity and the route.
# Start with a bounded watchlist and inspect the plan and batch progress.
enabled = false
# "watchlist" — exactly the symbols listed below. "index:<symbol>" — that
# index's latest constituents. There is no "all": see max_symbols.
scope = "watchlist"
symbols = []
# Hard ceiling on the resolved scope, checked before any fetch. 沪深300 resolves
# to ~300 names and so fails here until you raise this on purpose — the
# friction is deliberate, because the disk and the wire time are yours.
max_symbols = 200
# Concurrent TDX connections. As with [minute_bars], this does not raise the
# request rate (the limiter paces every request); it stops a lane idling on
# latency; actual throughput is route-dependent.
fetch_workers = 4

[futures]
# Per-contract futures and option chains (ADR-0013): futures_contracts,
# option_contracts, futures_bars, option_bars. Off by default and not part of
# `cne init`; nothing here costs anything until you turn it on.
#
# SOURCES. Exchange session files include contract settlements and zero-trade
# rows. Historical listed-contract completeness still needs separate evidence:
#   SHF  SHFE; INE has a separate 2018 futures daily file
#                                     futures 2002-01-07, options 2018-09-21
#   CZC  CZCE                            futures 2010-01-04, options 2017-04-19
#   GFE  GFEX                            futures 2022-12-22, options 2022-12-23
#   CFE  CFFEX                           futures 2010-04-16, options 2019-12-23
# Volume and open interest are single-sided throughout (the commodity exchanges
# counted both sides until 2019; halved on the way in), turnover is 元, implied
# volatility a fraction. Each exchange is one request per session and kind,
# except 2018 SHF futures sessions from 2018-03-26, which also need INE's file.
#
# HISTORY. `cne backfill futures_bars --start 2002-01-07` and `cne backfill
# option_bars --start 2017-04-19` (each exchange is asked only from its own
# first session). Bars backfills then rebuild the corresponding contracts and
# derived outputs automatically. Inspect --plan first; DCE Sina histories are
# per-contract, not per-day. --exchange narrows scope; --refresh rechecks data.
# Lifecycle dates require references; observation bounds do not prove expiry.
enabled = false
# Empty means every supported route ("SHF", "CZC", "GFE", "CFE", plus DCE
# when dce_route is not "off");
# "INE" is accepted as the SHF route, which joins the two where needed).
exchanges = []
options = true
# DCE's own endpoints answer with an access challenge. "sina" fills its futures
# from Sina (contracts listed from mid-2018; no turnover); "off" leaves DCE out;
# "official" reads DCE itself and is only worth choosing where
# `cne sources probe` shows the `dce` probe green.
dce_route = "sina"
# One-minute bars (futures_minute_bars), for a watchlist only. Sina keeps the
# latest 1023 bars per contract — about two sessions for a product that trades
# at night — so this grows forward from the day it is enabled, has no history
# before that, and must run every session. Night bars belong to the next
# trading day. `minute_products` captures each product's two most-held
# contracts on the latest session; `minute_contracts` names contracts.
minute_enabled = false
minute_products = []            # e.g. ["CU.SHF", "M.DCE", "IF.CFE"]
minute_contracts = []           # e.g. ["SC2612.INE"]
minute_max_contracts = 100

[failover]
enabled = true
# Optional audit artifact during historical backfills. Keep false so a slow
# backup source cannot block the canonical TDX/Baostock historical fetch.
backfill_snapshots = false

[[failover.datasets]]
name = "daily_bars"
primary = "qmt_bridge"
backup = "eastmoney"
compare_fields = ["close", "volume"]
price_tolerance_bps = 10
# Capture the independent peer every clean primary day so the revision gate
# has same-day evidence, including days with zero corporate actions/bars gaps.
snapshot_cadence = "daily"
revision_gate = true
# 0 compares the complete same-day universe; use a positive value for a
# deterministic exchange-stratified sample when the backup is expensive.
sample_limit = 500
max_drift_fraction = 0.0

[[failover.datasets]]
name = "corporate_actions"
primary = "qmt_bridge"
backup = "eastmoney"
compare_fields = ["cash_dividend", "bonus_ratio", "transfer_ratio"]
price_tolerance_bps = 10
snapshot_cadence = "daily"
revision_gate = true

[exchange_audit]
# `daily_bars` against the closes the SSE and SZSE publish themselves — the one
# price check in the lake that reaches the publisher rather than a second
# vendor. Gated on `[sources.exchange]`; findings are advisory and never fail
# a run. SSE serves only the session it is currently publishing, so SH is
# arbitrated same-day; SZSE serves any past date.
price_tolerance_bps = 10
# Turnover is looser on purpose: the exchange daily total folds in trading a
# continuous-auction bar excludes, so curated is legitimately a little lower.
# The finding fires on the *share* of the universe, so a standing definitional
# gap stays quiet while a widening one is caught.
turnover_tolerance_bps = 100
turnover_max_fraction = 0.15

[raw_archive]
# Exact source payloads are compressed under meta/raw. Request credentials,
# proxy settings, cookies, and authorization headers are never archived.
enabled = true
compression = "gzip"
max_payload_bytes = 33554432
# Omit datasets to archive the built-in critical/snapshot-only set, including
# per-page financial and shareholder backfills. This trades disk for recovery.
# datasets = ["announcement_index", "financial_statement_items", "top_holders"]

[universe]
# Which instrument classes the daily fetch covers.  `instruments` lists every
# code TDX returns and about a quarter are ETF/LOF/fund quote codes that no
# research profile selects and that no configured vendor reliably serves —
# fetching them costs a quarter of every sweep, trips the EastMoney and Sina
# circuit breakers on symbols nobody needs, and leaves unfillable keys in the
# coverage gate.  ST, suspended, CDR and delisted names are always kept: those
# are exactly what this lake exists to retain.
#   all_a           — SH/SZ/BJ A shares (default)
#   all_a_sh_sz     — drop the Beijing exchange as well
#   all_instruments — everything `instruments` lists, including ETF/LOF quotes
ingest = "all_a"
# Optional: also fetch daily bars for ETFs in the latest replayable, positively
# eligible exchange directory (at most 14 calendar days old). This does not
# change all_a stock queries or admit other ETF/LOF/fund codes.
ingest_eligible_etfs = false

# Wave DAG for daily job (see docs/zh/datasets/catalog.md)
[[job.daily.waves]]
name = "reference"
parallel = true
steps = ["instruments", "trading_calendar", "trading_status"]

[[job.daily.waves]]
name = "corp_actions_to_bars"
parallel = false
steps = ["corporate_actions", "daily_bars"]

[[job.daily.waves]]
name = "parallel_core"
parallel = true
steps = ["index_bars"]

[[job.daily.waves]]
name = "finalize"
parallel = false
# `ths_official_snapshot` refreshes the peer data `audit` arbitrates against.
# Without it those checks are permanently silent — nothing else writes the
# snapshots they read. It skips itself when no key is configured.
steps = [
    "compact",
    "derive_adj_factors",
    "derive_industry_index",
    "ths_official_snapshot",
    "audit",
]

# Group start times. Every `daily*` job takes the same non-blocking
# `daily_ingestion` lock, so a group that is still running when the next one
# fires does not queue — the next one aborts and that group is simply missing
# for the day. Spacing therefore has to cover the *slowest* plausible run, not
# the typical one.
#
# Use observed runtimes from your own scope/cache/route to size schedules.
# Prefer one scheduler sequencing the required groups; do not assume a region
# or worker count guarantees a particular runtime.
# When the scheduled jobs run, in Beijing time — whatever the host timezone.
# launchd/cron wake them hourly; each runs once per session after its run_at.
[job.daily]
run_at = "17:30"
[job.stale]
# Only retries the snapshot datasets the day's run missed.
run_at = "21:00"

# Per-group fetch frequency (docs/zh/getting-started/configuration.md, 取数频率):
#   cadence = "daily"   (default) or "weekly"
#   weekday = 5         weekly: run on the last session of the week up to this ISO weekday
# A weekly group rests only its history datasets (they catch up by date on the
# next run); its snapshot datasets (fund_flow, hot_rank, trading_status, …)
# still run every session, since a missed snapshot day is lost for good.
# futures_minute_bars also runs every session: its rolling window expires.
# `core` carries what the [[job.daily.waves]] spine fetches and derives, so the
# group schedule loses nothing; the finalize steps run in their fixed order
# after compact. Kept lean on purpose: `audit` reads the whole lake, so
# `cne run daily` runs it once after every group has landed, and suspensions
# come from the `trading_status` snapshot each day — the bar-gap derivation
# runs where bar history changes (`cne init`, `cne backfill daily_bars`).
[job.daily.groups.core]
at = "16:00"
parallel = true
steps = [
  "instruments", "trading_calendar", "trading_status",
  "corporate_actions", "daily_bars", "index_bars",
  "compact", "derive_adj_factors", "derive_industry_index",
  "ths_official_snapshot",
]

[job.daily.groups.capital]
at = "17:00"
parallel = true
steps = [
  "fund_flow", "northbound_holdings", "northbound_flows", "margin_trading",
  "valuation_metrics", "sector_members",
  "compact",
]

[job.daily.groups.signals]
at = "17:20"
parallel = true
steps = ["dragon_tiger", "block_trades", "compact"]

[job.daily.groups.fundamentals]
at = "17:35"
parallel = true
# share_structure / shareholder_counts are quarterly data, but filings trickle in
# over the weeks after each period end, so a daily re-sweep of the two most
# recent periods is how newly-disclosed ones get picked up.
#
# top_holders is deliberately NOT here: its page walk is far larger than those
# two and can overrun the gap to the next group. Run it on its own cadence:
# `cne backfill top_holders --start ... --end ...`.
steps = [
  "financial_statement_items", "earnings_disclosure_schedule",
  "index_constituents", "industry_members",
  "share_structure", "shareholder_counts", "compact",
]

[job.daily.groups.macro_risk]
at = "17:55"
parallel = true
steps = ["macro_indicators", "market_breadth", "share_unlock_schedule", "commodity_bars", "compact"]

[job.daily.groups.research]
at = "18:15"
parallel = true
# Rotation / headlines before sentiment so batch can score lake news without HTTP.
# `sentiment_scores` reads committed announcements and headlines out of the
# lake, so it needs those feeds published — not fetched in the same run. They
# are ingested by [job.events.groups] on their own calendar-day cadence.
steps = ["etf_profiles", "institutional_holdings", "analyst_consensus",
  "hot_rank", "sector_bars", "sector_fund_flow",
  "sentiment_scores", "compact"]

# Futures and options. Every step returns without a request unless [futures]
# enabled = true, so the group is harmless on a lake that has not opted in.
# After macro_risk because the exchanges publish their files in the late
# afternoon.
[job.daily.groups.derivatives]
at = "18:30"
parallel = true
steps = [
  "futures_bars", "option_bars", "futures_contracts", "option_contracts",
  "futures_minute_bars",
  "compact", "derive_futures_continuous", "derive_option_greeks",
]

# Not scheduled by anything: `cne run daily --group intraday` only. Enable
# [minute_bars] first, and read the horizon note there before expecting history.
[job.daily.groups.intraday]
at = "18:45"
parallel = true
steps = ["minute_bars", "minute_bars_5m", "compact"]

# Also unscheduled: `cne run daily --group ticks`. Its own group rather than a
# fourth entry in `intraday` above, so that turning on minute bars cannot drag
# transaction records along with it. Enable [trade_ticks] first.
[job.daily.groups.ticks]
at = "19:00"
parallel = true
steps = ["trade_ticks", "compact"]

# 7x24 event streams. Disclosures and news are published on weekends and
# holidays too, so these groups belong to their own job: `cne run events`
# ignores the trading calendar and takes the `events_ingestion` lock, which the
# evening batch does not hold. Only calendar-scoped datasets may be scheduled
# here, and a step may not also appear under [job.daily] (`cne validate` checks
# both) — the two jobs would otherwise ingest it twice, concurrently.
#
# `at` is when a scheduler fires the group. Firing it more often is safe and is
# how you get intraday freshness: each sweep re-reads its own reconciliation
# tail, so nothing is lost by a skipped tick, and a sweep that overlaps another
# is dropped by the lock rather than queued.
#
#   0 20 * * *   cne run events --group disclosures
#   */30 9-22 * * *   cne run events --group news_wire
[job.events.groups.disclosures]
at = "20:00"
parallel = true
steps = ["announcement_index", "compact"]

# Separate group, deliberately after `disclosures`: `regulatory_events` is a
# projection of *committed* announcements (derive/regulatory_events.py), so it
# needs the compact above to have published them. `cne run events` runs the
# groups in the order they appear here.
[job.events.groups.regulatory]
at = "20:20"
parallel = true
steps = ["regulatory_events", "compact"]

[job.events.groups.news_wire]
at = "21:00"
parallel = true
steps = ["news_headlines", "flash_news_wire", "compact"]

[job.init.phases]
names = [
  "phase1_reference",
  "phase2a_corporate_actions",
  "phase2c_daily_bars_backfill",
  "phase3_index_and_status",
  "phase4_finalize",
  "phase5_derive_and_publish",
]

[on_demand]
enabled = true
datasets = ["stock_news", "research_reports"]

[duckdb]
path = "{data.root}/duckdb/cnequity.duckdb"
memory_limit = "2GB"
threads = 4

# Optional. `cne decision-data` refuses any window reaching this date, so a
# research holdout stays unseen by evidence inventories. Unset: no limit.
# [research]
# holdout_start = 2025-01-01
